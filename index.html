<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Pong</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <header class="game-header">
      <div>
        <p class="eyebrow">ARCADE CLASSIC · <span id="levelBadge">NORMAL</span></p>
        <h1>Neon Pong</h1>
      </div>
      <div class="scoreboard" aria-label="Scoreboard">
        <span id="playerScore">0</span>
        <span class="score-divider">:</span>
        <span id="computerScore">0</span>
      </div>
    </header>

    <section class="game-card">
      <canvas id="gameCanvas" width="900" height="520" aria-label="Pong game area"></canvas>
      <div class="game-overlay" id="gameOverlay">
        <p id="overlayMessage">Pick a difficulty and start</p>
        <div class="levels" id="levels" role="radiogroup" aria-label="Difficulty">
          <button type="button" class="level" role="radio" aria-checked="false" data-level="easy">Easy</button>
          <button type="button" class="level" role="radio" aria-checked="true" data-level="normal">Normal</button>
          <button type="button" class="level" role="radio" aria-checked="false" data-level="hard">Hard</button>
          <button type="button" class="level" role="radio" aria-checked="false" data-level="insane">Insane</button>
        </div>
        <p class="record" id="recordLine"></p>
        <button id="startButton" type="button">Start Game</button>
      </div>
    </section>

    <footer class="controls">
      <span><kbd>↑</kbd><kbd>↓</kbd> Move paddle</span>
      <span><kbd>Mouse</kbd> Move paddle</span>
      <span><kbd>P</kbd> Pause</span>
      <span><kbd>1</kbd>–<kbd>4</kbd> Difficulty</span>
      <span>First to 5 wins</span>
      <button id="soundButton" class="ghost" type="button" aria-pressed="true">🔊 Sound on</button>
    </footer>
    <p class="credit">Developed by <a href="https://hetor.hehurove.workers.dev/es">Hetor</a></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
